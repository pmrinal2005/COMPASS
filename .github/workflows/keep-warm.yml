# Keeps Render's free instance awake (it sleeps after ~15 min idle) by pinging /api/health.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/health
        env:
          COMPASS_API_URL: ${{ secrets.COMPASS_API_URL }}
        run: curl --fail-with-body -sS --max-time 90 --retry 3 --retry-delay 15 "${COMPASS_API_URL%/}/api/health"
